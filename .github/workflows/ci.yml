name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Segredo FICTÍCIO (marcado SENTINEL) para detectar vazamento no bundle.
  REPORT_SIGNING_SECRET: ci-report-secret-SENTINEL-0123456789abcdef

jobs:
  qualidade:
    name: Qualidade (formatação, lint, tipos, unit, build, segredos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-SENTINEL-7f3a9c2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (falha se o lockfile divergir)
        run: npm ci

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test

      - name: Build de produção
        run: npm run build

      - name: Nenhum segredo no bundle do navegador
        run: npm run check:bundle-secrets

  supabase:
    name: Supabase (migrations, seed, integração, RLS, tipos, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Subir Supabase local (Auth, PostgREST, Storage, Mailpit) — aplica migrations + seed
        run: npx supabase start -x realtime,imgproxy,edge-runtime,logflare,vector,studio,postgres-meta,supavisor

      - name: Exportar chaves do Supabase local
        run: |
          eval "$(npx supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Testes de integração
        run: npm run test:integration

      - name: Testes de RLS (isolamento entre empresas e perfis)
        run: npm run test:rls

      - name: Tipos do banco atualizados
        run: |
          npm run db:types
          git diff --exit-code src/types/database.ts

      - name: Build de produção
        run: npm run build

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E (Chromium em 375, 768 e 1280 px)
        run: npm run e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Parar Supabase
        if: always()
        run: npx supabase stop --no-backup
